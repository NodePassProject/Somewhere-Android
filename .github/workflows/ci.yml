name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Style
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Protocol coverage gate
        run: ./gradlew koverVerifyDebug

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Assemble
        run: ./gradlew assembleDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  conformance:
    name: Protocol vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Recomputes every vector from the specification prose. It references no
      # upstream code and needs no clone, so it is the cheapest possible check
      # that the protocol understanding here is still self-consistent.
      - name: Verify protocol vectors
        run: python3 conformance/scripts/verify-vectors.py
